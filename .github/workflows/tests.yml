name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install OCR and fonts
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr fonts-dejavu-core
      - name: Install Python dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Compile Python
        run: python -m compileall -q app scripts
      - name: Run regression tests
        run: python -m pytest -q
      - name: Measure synthetic detection cases
        run: python -m scripts.evaluate
